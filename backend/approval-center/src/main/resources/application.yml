spring:
  application:
    name: approval-center
  datasource:
    url: jdbc:postgresql://localhost:5432/flowpass
    username: flowpass
    password: flowpass
    driver-class-name: org.postgresql.Driver
    hikari:
      # The Flowable async-job acquire threads keep running after the engine shuts down (non-daemon),
      # and when the DB is unreachable they block on getConnection() for connection-timeout. Keep it
      # short so those leftover threads fail fast instead of stalling the JVM for 30s on exit.
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  # Flowable process engine: let it create its own ACT_* tables on the same schema.
  flowable:
    database-schema-update: true

# Flowable async job executor — off. Our start/complete is synchronous (see FlowableEngineConfig), and this
# avoids background job-acquisition threads that linger (and fail) when Testcontainers stops. The key is
# `flowable.async-executor-activate` (the former `flowable.process.async-executor-activate` was ignored).
# Turn it on when timer / async features (timeouts, escalation) arrive.
flowable:
  async-executor-activate: false

mybatis:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 9000

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Outbox + webhook delivery pollers. Off by default so no background @Scheduled threads start during
# the Testcontainers lifecycle or block the JVM from exiting. Enable by setting scheduler-enabled=true
# in the runtime profile; the values below document the tunables pulled in by @Value defaults.
flowpass:
  # Deadline worker (reminders, overdue handling / escalation). Off by default like the other pollers; enable it in
  # the runtime profile. Safe on several nodes: every reminder / escalation is claimed with a conditional update.
  sla:
    scheduler-enabled: false
    batch-size: 100
    poll-interval-ms: 60000
    initial-delay-ms: 5000
  outbox:
    scheduler-enabled: false
    batch-size: 50
    poll-interval-ms: 5000
    initial-delay-ms: 1000
  webhook:
    batch-size: 50
    poll-interval-ms: 5000
    initial-delay-ms: 1000
    max-attempts: 3
    retry-delay-ms: 30000
